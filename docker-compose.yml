name: "dreamtrail-ai"

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT:-production}
    image: dreamtrail-ai-client:${VERSION:-latest}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      NEXT_TELEMETRY_DISABLED: 1
    volumes:
      # - ./client:/app
      - /app/node_modules
    ports:
      - 3000:3000

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT:-production}
    image: dreamtrail-ai-server:${VERSION:-latest}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PYTHONUNBUFFERED: 1
    volumes:
      - ./server:/app
    ports:
      - 8000:8000